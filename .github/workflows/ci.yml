name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Install CraftOS-PC AppImage runtime dependencies
        run: sudo apt-get install -y libpulse0 libxss1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Cache CraftOS-PC download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/invos-emulator
          key: craftos-pc-${{ runner.os }}-${{ hashFiles('tools/emulator/provision.py') }}

      - name: Run host Lua suite (controller/storage/tests)
        working-directory: controller
        run: lua storage/tests/run.lua

      - name: Run tools/ Python suite
        working-directory: tools
        run: python3 -m unittest test_recipe_pack test_recipe_import test_deploy

      - name: Run install.lua's pure-function suite
        run: lua install_test.lua

      - name: Run emulator suite (host Lua 5.2 + CraftOS-PC)
        working-directory: tools/emulator
        run: python3 run_tests.py all
